[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-graphics-lib"
version = "0.0.11"
description = "A simple graphics library for Python learners"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Max-Hillyer", email = "maxhillyer7012@gmail.com" },
]
dependencies = [
  "pygame",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Max-Hillyer/Simple_graphics"
Issues = "https://github.com/Max-Hillyer/Simple_graphics/issues"
